name: Atualização Diária Sheets

on:
  schedule:
    - cron: '0 4 * * *'  # 01:00 BRT = 04:00 UTC
  workflow_dispatch:        # permite rodar manualmente no GitHub Actions

permissions:
  contents: write   # necessário para o commit automático do snapshot JSON (ver step no fim do job)

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Chrome (para coletar_desempenho.py)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Instalar dependências Python
        run: pip install requests gspread google-auth selenium webdriver-manager

      - name: Rodar atualização diária
        run: python atualizar_diario.py
        env:
          ML_CLIENT_ID:            ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET:        ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN:        ${{ secrets.ML_REFRESH_TOKEN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ML_COOKIES_JSON:         ${{ secrets.ML_COOKIES_JSON }}
          CHROME_HEADLESS:         "1"
          DISPLAY:                 ""

      - name: Publicar snapshot JSON (Desempenho_Anuncios + Promocoes + Afiliados)
        # coletar_desempenho.py e coletar_promocoes.py rodam num runner
        # efêmero (sem disco persistente entre execuções), então o JSON
        # gerado em data/ precisa ser commitado de volta no repo aqui — é
        # assim que o weekly_digest.py (VPS) consegue buscar esse dado
        # depois, via URL raw do GitHub. Ver 28_ROADMAP_PIPELINE.md, Fase
        # 6.1 / A5. Promocoes adicionado em 2026-08-15, mesmo motivo do
        # Desempenho. Afiliados adicionado em 2026-09-12 (mesma cookie ML,
        # mesmo motivo). [skip ci] evita disparar o workflow de novo neste push.
        run: |
          if [ -d data ] && [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # git add -A em vez da lista explicita: os arquivos de afiliados ainda nao
            # existem no repo e nao sao criados quando o coletor falha (cookie
            # expirada, o cenario para o qual ele e nao-critico). git add em
            # pathspec que nao casa nada sai com erro, o step roda em bash -e, e
            # o job inteiro ficava vermelho por causa de um coletor opcional.
            git add -A data/
            git commit -m "chore: atualizar snapshot Desempenho_Anuncios + Promocoes + Afiliados [skip ci]"
            git push
          else
            echo "Nada novo em data/ para commitar."
          fi
