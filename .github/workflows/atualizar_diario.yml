name: Atualização Diária Sheets

on:
  schedule:
    - cron: '0 9 * * *'  # 06:00 BRT = 09:00 UTC
  workflow_dispatch:        # permite rodar manualmente no GitHub Actions

permissions:
  contents: write   # necessário para o commit automático do snapshot JSON (ver step no fim do job)

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Chrome (para coletar_desempenho.py)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Instalar dependências Python
        run: pip install requests gspread google-auth selenium webdriver-manager

      - name: Rodar atualização diária
        run: python atualizar_diario.py
        env:
          ML_CLIENT_ID:            ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET:        ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN:        ${{ secrets.ML_REFRESH_TOKEN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ML_COOKIES_JSON:         ${{ secrets.ML_COOKIES_JSON }}
          CHROME_HEADLESS:         "1"
          DISPLAY:                 ""

      - name: Publicar snapshot JSON (Desempenho_Anuncios + Promocoes)
        # Os coletores rodam num runner efemero (sem disco persistente entre
        # execucoes), entao o JSON gerado em data/ precisa ser commitado de
        # volta no repo aqui - e assim que o weekly_digest.py (VPS) consegue
        # buscar esse dado depois, via URL raw do GitHub. Ver
        # 28_ROADMAP_PIPELINE.md, Fase 6.1 / A5 e o item AP.1.
        #
        # desempenho_*.json REINCLUIDO em 2026-09-12: o commit que o gerava
        # (48aa864, "descoberta dinamica de anuncios + snapshot JSON") vivia
        # so na master e nunca chegou aqui; agora esta nesta branch. Era a
        # ponta que faltava - o coletor podia funcionar e o dado nao chegava
        # ao relatorio semanal de jeito nenhum.
        #
        # git add -A data/ em vez da lista explicita de caminhos: e o que
        # evita o "fatal: pathspec did not match any files" que derrubou o
        # job em 2026-08-22 e que motivou a exclusao do desempenho. Arquivo
        # que o coletor nao gerou simplesmente nao entra, sem matar o step.
        # [skip ci] evita disparar o workflow de novo neste push.
        run: |
          if [ -d data ] && [ -n "$(git status --porcelain data/ 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A data/
            git commit -m "chore: atualizar snapshot Desempenho_Anuncios + Promocoes [skip ci]"
            git push
          else
            echo "Nada novo em data/ para commitar."
          fi
